name = "gold-rush"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-08"

[[durable_objects.bindings]]
name = "MULTIPLAYER_ROOMS"
class_name = "MultiplayerRoom"
script_name = "gold-rush-mp-room"

# F-LBKV-1 (2026-08-04): standings/bugs/stats read `env.TELEMETRY ?? env.ACCOUNTS`; no KV
# was ever bound, so every write fail-softed to `stored:false` since LB-01 shipped. This
# top-level block binds BOTH environments (Pages toml semantics) on every deploy.
[[kv_namespaces]]
binding = "TELEMETRY"
id = "f22215557bbe46e0a283953b8a0cfb4b"

# Same never-bound class, found minutes later: _multiplayer.ts requires MULTIPLAYER_RATE_LIMITS
# (mp:ratelimit:* keys) and 503s "riding together isn't saddled yet" without it — production
# co-op was gated off since the ladder merged. Shares the telemetry namespace; keys are prefixed.
[[kv_namespaces]]
binding = "MULTIPLAYER_RATE_LIMITS"
id = "f22215557bbe46e0a283953b8a0cfb4b"
