[project]
name = "goldrush"
version = "0.1.0"
description = "Prime Intellect verifier environment for deterministic Gold Rush contracts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "verifiers>=0.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["goldrush/**", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 1

