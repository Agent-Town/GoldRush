# agenttown.app — droplet nginx (mirror of /etc/nginx/sites-enabled/agenttown.app.conf)
# L3 cutover 2026-08-23: /api/standings* (boards + assay queue/verdict) served by the local
# sqlite ledger (goldrush-ledger.service, 127.0.0.1:8791); every other /api/* path forwards to
# the Cloudflare functions — accounts until the owner provides RESEND_API_KEY/AUTH_CODE_PEPPER
# for the droplet env, multiplayer permanently (stateful edge DO, out of scope per the spec).
# Ledger down => honest 503 {"ok":false,"error":"ledger_resting"} (spec Law 3).
server {
    server_name agenttown.app www.agenttown.app;
    root /opt/goldrush/site;
    index index.html;
    location /api/standings {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        error_page 502 503 504 = @ledger_resting;
    }
    location ~ ^/api/(request-code|verify|session|save/|delete-account) {
        # Accounts flipped onto the ledger 2026-08-24 (owner provided RESEND_API_KEY +
        # AUTH_CODE_PEPPER; fresh pepper is lawful: the sqlite book started empty).
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        error_page 502 503 504 = @ledger_resting;
    }
    location /api/ {
        # Residual forward: multiplayer (permanent - stateful edge DO) + /api/stats.
        # Resolved at REQUEST time (resolver + variable), never at config load: a static
        # upstream hostname made nginx startup hostage to a single DNS lookup — one
        # transient failure during the 2026-08-26 06:09 UTC unattended libssl upgrade
        # killed nginx and took agenttown.app down (Cloudflare 521) for ~2 days.
        resolver 127.0.0.53 1.1.1.1 valid=300s;
        set $pages_upstream gold-rush-3in.pages.dev;
        proxy_pass https://$pages_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host gold-rush-3in.pages.dev;
    }
    location @ledger_resting {
        default_type application/json;
        return 503 '{"ok":false,"error":"ledger_resting"}';
    }
    location /goldrush {
        return 302 https://gold-rush-3in.pages.dev/;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/agenttown.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/agenttown.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    listen 80;
    server_name agenttown.app www.agenttown.app;
    return 301 https://$host$request_uri;
}
